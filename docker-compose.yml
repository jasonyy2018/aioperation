services:
  automedia-ai:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: automedia_ai_platform
    image: automedia-ai-platform:latest
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      # 持久化 SQLite 数据库（用户/会话/资产数据）
      # 使用命名卷: 首次挂载时自动继承镜像内 /app/data 的属主 (uid 1001)，
      # 无需在宿主机手动 chown，杜绝 SQLITE_CANTOPEN 权限问题
      - automedia-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=8765
      - HOSTNAME=0.0.0.0
      # AI API Keys (passed from host or set via docker-compose.yml env)
      - MM_API_KEY=${MM_API_KEY}
      - HY_API_KEY=${HY_API_KEY}
      - AGNES_API_KEY=${AGNES_API_KEY}
      - ARK_API_KEY=${ARK_API_KEY}
      - SEEDANCE_MINI_API_KEY=${SEEDANCE_MINI_API_KEY}
    # 数据目录权限：容器内 nextjs 用户 (uid 1001) 需可写
    user: "1001:1001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8765/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - automedia-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  automedia-net:
    driver: bridge

volumes:
  automedia-data:
